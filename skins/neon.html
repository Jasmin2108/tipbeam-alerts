<!doctype html><html><head><meta charset="utf-8"><title>TipBeam – neon</title><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#box{position:absolute;left:50%;top:15%;transform:translateX(-50%);opacity:0;text-align:center;max-width:80vw}
#box.show{animation:pop 6s ease forwards}
.who,.verb,.amt{display:inline}.msg{display:block;margin-top:.4em}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.5)}10%,85%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}
#box{font:700 42px system-ui,sans-serif;color:#fff;padding:24px 36px;border:3px solid #ff2bd6;border-radius:18px;background:rgba(10,0,25,.75);box-shadow:0 0 20px #ff2bd6,inset 0 0 20px #00f0ff;text-shadow:0 0 8px #00f0ff,0 0 18px #ff2bd6}.amt{color:#39ff14}.msg{font-size:28px;color:#bdf}
</style></head><body><div id="box"><span class="who"></span> <span class="verb"></span> <span class="amt"></span><span class="msg"></span></div>
<script>
const L={en:"tipped",fi:"tippasi",sv:"tipsade"};
const S=[{name:"Aino",amount:"0.25",message:"Hyvä peli!",lang:"fi"},{name:"Erik",amount:"0.1",message:"Snyggt spelat!",lang:"sv"},{name:"Sam",amount:"0.5",message:"GG, keep going!",lang:"en"}];
const p=new URLSearchParams(location.search);
function show(t){const b=document.getElementById("box");const l=L[t.lang]||L.en;
b.querySelector(".who").textContent=t.name||"Someone";b.querySelector(".verb").textContent=l;
b.querySelector(".amt").textContent=(t.amount||"0")+" SOL";b.querySelector(".msg").textContent=t.message||"";
b.classList.remove("show");void b.offsetWidth;b.classList.add("show");}
if(p.has("name")||p.has("amount")){show({name:p.get("name"),amount:p.get("amount"),message:p.get("message"),lang:p.get("lang")});}
else{let i=0;const go=()=>show(S[i++%S.length]);go();setInterval(go,8000);}
</script>
</body></html>
